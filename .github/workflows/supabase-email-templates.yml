name: supabase-email-templates

# Sets the production Supabase project's "Magic Link" email (used by the
# app's Forgot PIN sign-in code) from supabase/templates/magic_link.html,
# subject "FieldOS verification code". The hosted project does not read
# supabase/config.toml, so this is how the template reaches production.
# Safe to run again. Only the magic-link subject and body are changed.
#
# Needs secrets SUPABASE_URL and SUPABASE_ACCESS_TOKEN (already set for
# supabase-deploy).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  set-template:
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Set the Magic Link email
        run: |
          set -euo pipefail
          missing=""
          [ -z "$SUPABASE_URL" ] && missing="$missing SUPABASE_URL"
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secrets:$missing"
            exit 1
          fi
          ref=$(echo "$SUPABASE_URL" | sed -E 's#https?://([^.]+)\..*#\1#')
          body=$(jq -n --arg subject "FieldOS verification code" \
            --rawfile content supabase/templates/magic_link.html \
            '{mailer_subjects_magic_link: $subject, mailer_templates_magic_link_content: $content}')
          code=$(curl -sS -o resp.json -w '%{http_code}' -X PATCH \
            "https://api.supabase.com/v1/projects/$ref/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' -d "$body")
          if [ "$code" != "200" ]; then
            echo "::error::Supabase answered HTTP $code"
            jq -r '.message // .' resp.json || true
            exit 1
          fi
          subject=$(jq -r '.mailer_subjects_magic_link' resp.json)
          has_token=$(jq -r '.mailer_templates_magic_link_content | contains("{{ .Token }}")' resp.json)
          otp_exp=$(jq -r '.mailer_otp_exp' resp.json)
          rm -f resp.json
          echo "Subject: $subject; template shows the code: $has_token; code lifetime (s): $otp_exp"
          echo "## Magic Link email set: \"$subject\", code shown: $has_token, lifetime ${otp_exp}s" >> "$GITHUB_STEP_SUMMARY"
          [ "$has_token" = "true" ] || { echo "::error::Template does not show the code"; exit 1; }
