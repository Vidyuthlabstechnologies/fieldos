name: frontend

# Started by hand only (issue #149): the owner keeps GitHub Actions off, so
# nothing runs on push or PR. Run the same checks locally (AGENTS.md).
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - run: npm test

      - name: Static export build
        run: npm run build
