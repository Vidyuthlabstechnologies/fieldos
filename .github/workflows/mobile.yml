name: mobile

on:
  push:
    branches: [master]
    paths: ['fieldos_mobile/**', 'supabase/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['fieldos_mobile/**', 'supabase/**', '.github/workflows/mobile.yml']

jobs:
  analyze-and-test:
    # Real-infrastructure discipline: the sync tests self-skip when the
    # Supabase stack is down, which would make a green run meaningless --
    # so the stack is started here and the full suite runs against it.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fieldos_mobile
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start local Supabase stack (applies migrations + seed)
        working-directory: .
        run: supabase start

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test --reporter compact

  android-build:
    # analyze + test run in the Dart VM and never touch Gradle, so a plugin
    # that breaks the Android build (AGP/Kotlin/compileSdk mismatches have
    # bitten this project before -- see docs/MOBILE_GUIDE.md) would only
    # surface at release time. Build a real APK on every change instead.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fieldos_mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build apk --debug

  ios-build:
    # Same idea as android-build, for the iPhone app. No Apple signing in
    # CI yet (that needs the owner's Apple Developer account), so this
    # checks that everything compiles and links, which is what breaks.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: fieldos_mobile
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build ios --release --no-codesign

  webhook-test:
    # The RevenueCat webhook's event -> plan mapping (Deno edge function).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test supabase/functions/revenuecat-webhook/plan_test.ts
