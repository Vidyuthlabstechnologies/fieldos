name: mobile

on:
  push:
    branches: [master]
    paths: ['fieldos_mobile/**', 'supabase/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['fieldos_mobile/**', 'supabase/**', '.github/workflows/mobile.yml']
  workflow_dispatch:
    inputs:
      ios:
        description: 'Also build the iPhone app (macOS runner, billed at 10x minutes)'
        type: boolean
        default: false

# A newer push to the same branch makes the older run pointless: stop it
# rather than pay for both.
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    # Real-infrastructure discipline: the sync tests self-skip when the
    # Supabase stack is down, which would make a green run meaningless --
    # so the stack is started here and the full suite runs against it.
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: fieldos_mobile
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start local Supabase stack (applies migrations + seed)
        working-directory: .
        run: supabase start

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test --reporter compact

  android-build:
    # analyze + test run in the Dart VM and never touch Gradle, so a plugin
    # that breaks the Android build (AGP/Kotlin/compileSdk mismatches have
    # bitten this project before -- see docs/MOBILE_GUIDE.md) would only
    # surface at release time. Build a real APK on every change instead.
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: fieldos_mobile
    steps:
      - uses: actions/checkout@v7

      # The APK carries every CPU type, the Python runtime and the on-phone
      # speech and translation libraries; it outgrew the runner's free disk
      # ("No space left on device" while packaging). Remove preinstalled
      # toolchains these jobs never use. The Android SDK stays.
      - name: Free disk space
        # Only on GitHub's machines: never delete things on your own computer.
        if: runner.environment == 'github-hosted'
        working-directory: .
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL /usr/share/swift \
            /usr/local/share/powershell /usr/local/share/chromium /usr/local/share/boost
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /

      # On your own computer (self-hosted runner) Java and the Android SDK
      # aren't there already, as they are on GitHub's machines.
      - uses: actions/setup-java@v6
        if: runner.environment != 'github-hosted'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: runner.environment != 'github-hosted'

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build apk --debug

  ios-build:
    # Same idea as android-build, for the iPhone app. No Apple signing in
    # CI yet (that needs the owner's Apple Developer account), so this
    # checks that everything compiles and links, which is what breaks.
    #
    # Not on every pull request push: a macOS minute is billed as ten, so
    # this one job was most of the account's Actions minutes, and in
    # November 2026 GitHub stopped starting jobs for the account.
    # Merges to master don't run it either: only a manual run from the
    # Actions tab with "Also build the iPhone app" ticked does.
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    runs-on: macos-latest
    defaults:
      run:
        working-directory: fieldos_mobile
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build ios --release --no-codesign
