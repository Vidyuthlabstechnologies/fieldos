name: release

# Push a tag like `v0.2.0` to build both shipped artifacts and attach them
# to a GitHub Release created from that tag. Each platform is a separate
# job so one failing doesn't block the other from publishing.
#
# Or run it from the Actions tab ("Run workflow"): it then releases the
# version in fieldos_mobile/pubspec.yaml as tag v<version>, created on the
# commit it runs from. No git or command line needed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mobile:
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: fieldos_mobile
    steps:
      - uses: actions/checkout@v7

      # The APK carries every CPU type, the Python runtime and the on-phone
      # speech and translation libraries; it outgrew the runner's free disk
      # ("No space left on device" while packaging). Remove preinstalled
      # toolchains these jobs never use. The Android SDK stays.
      - name: Free disk space
        # Only on GitHub's machines: never delete things on your own computer.
        if: runner.environment == 'github-hosted'
        working-directory: .
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL /usr/share/swift \
            /usr/local/share/powershell /usr/local/share/chromium /usr/local/share/boost
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /

      # On your own computer (self-hosted runner) Java and the Android SDK
      # aren't there already, as they are on GitHub's machines.
      - uses: actions/setup-java@v6
        if: runner.environment != 'github-hosted'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: runner.environment != 'github-hosted'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - run: flutter pub get

      # Upload-key signing from the four secrets below (Settings -> Secrets
      # and variables -> Actions on the repo). Without them the build step
      # stops: a debug-signed copy can't go to Play anyway.
      - name: Write release keystore from secrets
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/fieldos-upload.keystore
          cat > android/app/key.properties <<EOF
          storeFile=fieldos-upload.keystore
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # A store build needs the production Supabase project, the RevenueCat
      # key and the upload key. tool/android/build_store_release.sh refuses
      # to build without any of them (a build without them installs fine but
      # runs offline-only or with no paywall), so this job fails instead of
      # publishing a valid-looking but broken release.
      - name: Build release APK and App Bundle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          REVENUECAT_ANDROID_KEY: ${{ secrets.REVENUECAT_ANDROID_KEY }}
          REVENUECAT_IOS_KEY: ${{ secrets.REVENUECAT_IOS_KEY }}
          # The "Web application" OAuth client id from Google Cloud (public,
          # also set in Supabase by the supabase-google-auth workflow).
          # Without it the "Continue with Google" button is hidden.
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          # Published privacy policy and terms pages (repository variables,
          # not secrets). Default: the live site on Netlify.
          PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL || 'https://fieldos-mldynamic.netlify.app/privacy-policy.html' }}
          TERMS_URL: ${{ vars.TERMS_URL || 'https://fieldos-mldynamic.netlify.app/terms-of-use.html' }}
        run: bash tool/android/build_store_release.sh

      - uses: actions/upload-artifact@v7
        with:
          name: mobile-release
          path: |
            fieldos_mobile/build/app/outputs/flutter-apk/app-release.apk
            fieldos_mobile/build/app/outputs/bundle/release/app-release.aab

      - name: Record signing status for the release job
        run: echo "${{ steps.keystore.outputs.signed == 'true' && 'signed' || 'unsigned (debug key -- verification build only)' }}" > /tmp/mobile-signing-status.txt
      - uses: actions/upload-artifact@v7
        with:
          name: mobile-signing-status
          path: /tmp/mobile-signing-status.txt

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - run: pip install -r requirements-build.txt
      - run: pyinstaller desktop_app.spec

      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

      - run: npm install
      - run: mkdir -p src-tauri/binaries
        shell: bash
      - run: cp dist/FieldOS-backend.exe src-tauri/binaries/FieldOS-backend-x86_64-pc-windows-msvc.exe
        shell: bash
      - run: npx tauri build

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  publish-release:
    needs: [mobile, desktop]
    if: always() && (needs.mobile.result == 'success' || needs.desktop.result == 'success')
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: fieldos_mobile/pubspec.yaml

      - name: Work out the tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            v=$(sed -n 's/^version: \([0-9.]*\).*/\1/p' fieldos_mobile/pubspec.yaml)
            echo "name=v$v" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Build release notes
        run: |
          {
            echo "Automated build of ${{ steps.tag.outputs.name }}."
            echo
            if [ -f artifacts/mobile-signing-status/mobile-signing-status.txt ]; then
              echo "- Mobile APK/AAB: $(cat artifacts/mobile-signing-status/mobile-signing-status.txt)"
            else
              echo "- Mobile build: failed, see the mobile job for details"
            fi
            if [ -d artifacts/desktop-installer ]; then
              echo "- Desktop installer: built"
            else
              echo "- Desktop build: failed, see the desktop job for details"
            fi
          } > /tmp/release-notes.md

      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.tag.outputs.name }}
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          body_path: /tmp/release-notes.md
          draft: true
          files: |
            artifacts/mobile-release/**/*.apk
            artifacts/mobile-release/**/*.aab
            artifacts/desktop-installer/**/*.exe
            artifacts/desktop-installer/**/*.msi
