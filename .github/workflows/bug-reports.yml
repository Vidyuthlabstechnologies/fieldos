name: bug-reports

# Turns new reports from the app's "Report a bug" page
# into GitHub issues labelled bug-report. Uses the same SUPABASE_URL and
# SUPABASE_ACCESS_TOKEN secrets as supabase-deploy; the service role key is
# fetched here at run time and never stored in the repo or the app.
# Manual backfill only (issue #142): new reports are filed by the
# report-to-github edge function, with no Actions minutes.
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: bug-reports
  cancel-in-progress: false

jobs:
  file-issues:
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Skip until the cloud is set up
        id: ready
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_URL / SUPABASE_ACCESS_TOKEN not set yet; nothing to do."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.ready.outputs.ok == 'true'

      - uses: supabase/setup-cli@v3
        if: steps.ready.outputs.ok == 'true'
        with:
          version: latest

      - name: File new reports as issues
        if: steps.ready.outputs.ok == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ref=$(echo "$SUPABASE_URL" | sed -E 's#^https?://([^.]+)\.supabase\.co.*#\1#')
          key=$(supabase projects api-keys --project-ref "$ref" -o json \
            | python3 -c 'import json,sys; print(next(k["api_key"] for k in json.load(sys.stdin) if k["name"]=="service_role"))')
          echo "::add-mask::$key"
          SUPABASE_SERVICE_KEY="$key" python3 tools/file_bug_reports.py
