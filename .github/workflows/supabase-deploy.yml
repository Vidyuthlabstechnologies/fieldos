name: supabase-deploy

# One click from the Actions tab sets up (or updates) the production
# Supabase database: it applies every file in supabase/migrations that the
# project doesn't have yet. Safe to run again; already-applied migrations
# are skipped. seed.sql (test data) is never applied.
#
# Needs three repo secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL           the project URL, https://<ref>.supabase.co
#   SUPABASE_ACCESS_TOKEN  a personal access token from supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   the database password chosen when creating the project
# and, once the Team plan is set up in RevenueCat:
#   REVENUECAT_WEBHOOK_SECRET  any long random text; the same value goes in
#                              RevenueCat -> Integrations -> Webhooks -> Authorization header
on:
  workflow_dispatch:

jobs:
  push-migrations:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      REVENUECAT_WEBHOOK_SECRET: ${{ secrets.REVENUECAT_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the secrets are set
        run: |
          missing=""
          [ -z "$SUPABASE_URL" ] && missing="$missing SUPABASE_URL"
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secrets:$missing"
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to the production project
        run: |
          ref=$(echo "$SUPABASE_URL" | sed -E 's#^https?://([^.]+)\.supabase\.co.*#\1#')
          if [ "$ref" = "$SUPABASE_URL" ] || [ -z "$ref" ]; then
            echo "::error::SUPABASE_URL should look like https://abcdefghijkl.supabase.co"
            exit 1
          fi
          supabase link --project-ref "$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
        id: link

      - name: Apply migrations
        run: supabase db push

      # The RevenueCat webhook that switches a company to the Team plan.
      # RevenueCat can't send a Supabase login token, so the function checks
      # its own shared secret instead (--no-verify-jwt).
      - name: Deploy the payments webhook
        if: env.REVENUECAT_WEBHOOK_SECRET != ''
        run: |
          supabase secrets set --project-ref "${{ steps.link.outputs.ref }}" REVENUECAT_WEBHOOK_SECRET="$REVENUECAT_WEBHOOK_SECRET"
          supabase functions deploy revenuecat-webhook --project-ref "${{ steps.link.outputs.ref }}" --no-verify-jwt
          echo "Webhook URL: https://${{ steps.link.outputs.ref }}.supabase.co/functions/v1/revenuecat-webhook"
