name: supabase-deploy

# One click from the Actions tab sets up (or updates) the production
# Supabase database: it applies every file in supabase/migrations that the
# project doesn't have yet. Safe to run again; already-applied migrations
# are skipped. seed.sql (test data) is never applied.
#
# Needs three repo secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL           the project URL, https://<ref>.supabase.co
#   SUPABASE_ACCESS_TOKEN  a personal access token from supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   the database password chosen when creating the project
on:
  workflow_dispatch:

jobs:
  push-migrations:
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the secrets are set
        run: |
          missing=""
          [ -z "$SUPABASE_URL" ] && missing="$missing SUPABASE_URL"
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secrets:$missing"
            exit 1
          fi

      # Pinned: CLI 3.0 changed `db push` to target a local stack unless
      # --remote is passed, which broke the first production deploy.
      - uses: supabase/setup-cli@v3
        with:
          version: 3.0.0

      - name: Link to the production project
        run: |
          ref=$(echo "$SUPABASE_URL" | sed -E 's#^https?://([^.]+)\.supabase\.co.*#\1#')
          if [ "$ref" = "$SUPABASE_URL" ] || [ -z "$ref" ]; then
            echo "::error::SUPABASE_URL should look like https://abcdefghijkl.supabase.co"
            exit 1
          fi
          supabase link --project-ref "$ref"

      - name: Apply migrations
        # The manual run from the Actions tab is the confirmation.
        run: supabase db push --remote --yes
