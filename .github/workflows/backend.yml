name: backend

# Started by hand only (issue #149): the owner keeps GitHub Actions off, so
# nothing runs on push or PR. Run the same checks locally (AGENTS.md).
on:
  workflow_dispatch:

jobs:
  test:
    # Fully offline by design (see README.md) -- SQLite only, no external
    # services to stand up.
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - run: python -m pytest tests/ -v
