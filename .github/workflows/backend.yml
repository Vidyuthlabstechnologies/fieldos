name: backend

on:
  push:
    branches: [master]
    paths: ['fieldos/**', 'tests/**', 'requirements.txt', 'alembic.ini', '.github/workflows/backend.yml']
  pull_request:
    paths: ['fieldos/**', 'tests/**', 'requirements.txt', 'alembic.ini', '.github/workflows/backend.yml']

jobs:
  test:
    # Fully offline by design (see README.md) -- SQLite only, no external
    # services to stand up.
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - run: python -m pytest tests/ -v
