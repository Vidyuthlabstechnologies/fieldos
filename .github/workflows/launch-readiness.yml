name: launch-readiness

# One click from the Actions tab answers "what is still missing before the
# store build?": a table of every launch secret (set / not set), whether
# each one is the right kind of value (the anon key and not service_role,
# RevenueCat's public SDK keys and not a secret API key, a keystore that
# opens with the alias and passwords given), and what the production
# Supabase project reports (migrations deployed, email sign-up settings).
# No value is ever printed. Settings -> Secrets is owner-only on a personal
# repo, so this is how everyone else sees where issues #50 and #51 stand.
#
# Fails only when a secret that IS set is wrong; missing ones just show ⬜.
on:
  workflow_dispatch:
  pull_request:
    paths: ['tools/launch_readiness.py', '.github/workflows/launch-readiness.yml']

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      REVENUECAT_ANDROID_KEY: ${{ secrets.REVENUECAT_ANDROID_KEY }}
      REVENUECAT_IOS_KEY: ${{ secrets.REVENUECAT_IOS_KEY }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      # keytool, to check the upload keystore opens with the alias and passwords.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check the launch secrets and the Supabase project
        run: python3 tools/launch_readiness.py
