name: supabase-prod-settings

# One-off production settings that are not migrations, so nobody has to
# click them in the Supabase dashboard (issue #228). Safe to re-run: each
# step sets a value and reads it back.
#
#   webhook sender   app_config.webhook_dispatch_url -> this project's
#                    webhook-dispatch function (#224); until it is set,
#                    company webhooks queue but are never sent
#   office redirect  adds the office web app's address to Auth's redirect
#                    list, so "Sign in with Google" works there; addresses
#                    already on the list are kept
#   selfie purge     only when the purge_verified_selfies box is ticked:
#                    runs `select purge_verified_selfies();` once, which
#                    deletes the stored selfies of check-in days already
#                    decided (#233). It cannot be undone; the owner OKed it
#                    on 2026-11-23. account-cleanup / system-logs then
#                    remove the files.
#   pilot plans      only when the pilot_plans box is ticked: gives each
#                    pilot owner account (the pilots' domain) a 60-day
#                    3-site pilot plan, PILOT-<n>, unless one is already
#                    running. Prints counts only, never the addresses.
#   cron check       always: lists the background jobs, read only.
#
# Uses the SUPABASE_URL and SUPABASE_ACCESS_TOKEN secrets supabase-deploy
# already has.
on:
  workflow_dispatch:
    inputs:
      purge_verified_selfies:
        description: "Also delete stored selfies of check-in days already decided (cannot be undone)"
        type: boolean
        default: false
      pilot_plans:
        description: "Give the pilot owner accounts their 60-day pilot plan if none is running"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  apply:
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-latest' }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      OFFICE_URL: https://fieldos-mldynamic.netlify.app/office/
    steps:
      - name: Check secrets
        run: |
          missing=""
          [ -z "$SUPABASE_URL" ] && missing="$missing SUPABASE_URL"
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          if [ -n "$missing" ]; then echo "::error::Missing:$missing"; exit 1; fi
          ref=$(echo "$SUPABASE_URL" | sed -E 's#https?://([^.]+)\..*#\1#')
          echo "REF=$ref" >> "$GITHUB_ENV"

      - name: Webhook sender address
        run: |
          set -euo pipefail
          url="https://$REF.supabase.co/functions/v1/webhook-dispatch"
          sql="insert into public.app_config (id, webhook_dispatch_url) values (true, '$url') on conflict (id) do update set webhook_dispatch_url = excluded.webhook_dispatch_url returning webhook_dispatch_url;"
          body=$(jq -n --arg q "$sql" '{query: $q}')
          code=$(curl -sS -o resp.json -w '%{http_code}' -X POST \
            "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' -d "$body")
          if [ "$code" != "200" ] && [ "$code" != "201" ]; then
            echo "::error::Supabase answered HTTP $code"; jq -r '.message // .' resp.json || true; exit 1
          fi
          got=$(jq -r '.[0].webhook_dispatch_url // empty' resp.json)
          rm -f resp.json
          [ "$got" = "$url" ] || { echo "::error::webhook_dispatch_url reads back as '$got'"; exit 1; }
          echo "webhook_dispatch_url = $got"
          echo "## Webhook sender: $got" >> "$GITHUB_STEP_SUMMARY"

      - name: Office app on the Auth redirect list
        run: |
          set -euo pipefail
          api="https://api.supabase.com/v1/projects/$REF/config/auth"
          code=$(curl -sS -o cur.json -w '%{http_code}' "$api" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          [ "$code" = "200" ] || { echo "::error::reading auth config: HTTP $code"; exit 1; }
          list=$(jq -r '.uri_allow_list // ""' cur.json)
          rm -f cur.json
          if printf '%s' "$list" | tr ',' '\n' | grep -qxF "$OFFICE_URL"; then
            echo "Already on the list."
          else
            new=$( [ -z "$list" ] && echo "$OFFICE_URL" || echo "$list,$OFFICE_URL" )
            body=$(jq -n --arg l "$new" '{uri_allow_list: $l}')
            code=$(curl -sS -o resp.json -w '%{http_code}' -X PATCH "$api" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' -d "$body")
            if [ "$code" != "200" ]; then
              echo "::error::Supabase answered HTTP $code"; jq -r '.message // .' resp.json || true; exit 1
            fi
            printf '%s' "$(jq -r '.uri_allow_list' resp.json)" | tr ',' '\n' | grep -qxF "$OFFICE_URL" \
              || { echo "::error::office address not on the list after the update"; exit 1; }
            rm -f resp.json
            echo "Added $OFFICE_URL"
          fi
          echo "## Office redirect on the list: $OFFICE_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Delete selfies of days already decided
        if: ${{ inputs.purge_verified_selfies }}
        run: |
          set -euo pipefail
          body=$(jq -n '{query: "select purge_verified_selfies() as deleted;"}')
          code=$(curl -sS -o resp.json -w '%{http_code}' -X POST \
            "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' -d "$body")
          if [ "$code" != "200" ] && [ "$code" != "201" ]; then
            echo "::error::Supabase answered HTTP $code"; jq -r '.message // .' resp.json || true; exit 1
          fi
          n=$(jq -r '.[0].deleted // empty' resp.json)
          rm -f resp.json
          [ -n "$n" ] || { echo "::error::no count returned"; exit 1; }
          echo "Deleted $n stored selfies of decided days"
          echo "## Selfies of decided days deleted: $n" >> "$GITHUB_STEP_SUMMARY"

      - name: Pilot company plans
        if: ${{ inputs.pilot_plans }}
        run: |
          set -euo pipefail
          sql=$(cat <<'SQL'
          with u as (
            select lower(email) as e, substring(lower(email) from '^pilot([0-9]+)[.]owner@') as n,
                   email_confirmed_at is not null as confirmed
            from auth.users where lower(email) ~ '^pilot[0-9]+[.]owner@pilots[.]mldynamic[.]com$'
          ), todo as (
            select * from u where not exists (
              select 1 from public.company_plans p
              where p.invoice_ref = 'PILOT-' || u.n and p.ends_on >= public.ist_today())
          ), granted as (
            select public.grant_company_plan(p_plan => 'pilot', p_ends_on => public.ist_today() + 60,
                     p_owner_email => e, p_invoice_ref => 'PILOT-' || n, p_site_limit => 3) as id
            from todo
          )
          select (select count(*) from u) as accounts,
                 (select count(*) from u where confirmed) as confirmed,
                 (select count(*) from granted) as granted_now;
          SQL
          )
          run_sql() {
            body=$(jq -n --arg q "$1" '{query: $q}')
            code=$(curl -sS -o resp.json -w '%{http_code}' -X POST \
              "https://api.supabase.com/v1/projects/$REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' -d "$body")
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "::error::Supabase answered HTTP $code"; jq -r '.message // .' resp.json || true; exit 1
            fi
          }
          run_sql "$sql"
          jq -c '.[0]' resp.json
          run_sql "select invoice_ref, plan, site_limit, starts_on, ends_on, company_id is not null as on_company from public.company_plans where invoice_ref like 'PILOT-%' and ends_on >= public.ist_today() order by invoice_ref;"
          jq -c '.[]' resp.json
          n=$(jq 'length' resp.json); rm -f resp.json
          echo "## Pilot plans running: $n" >> "$GITHUB_STEP_SUMMARY"
          [ "$n" -ge 1 ] || { echo "::error::no pilot plan is running after the grant"; exit 1; }

      - name: Background jobs (read only)
        run: |
          set -euo pipefail
          body=$(jq -n '{query: "select jobname, schedule, active from cron.job order by jobname;"}')
          code=$(curl -sS -o resp.json -w '%{http_code}' -X POST \
            "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' -d "$body")
          [ "$code" = "200" ] || [ "$code" = "201" ] || { echo "::error::HTTP $code"; cat resp.json; exit 1; }
          jq -c '.[]' resp.json
          rm -f resp.json

      - name: Organisation members (read only, addresses masked)
        run: |
          set -euo pipefail
          h=(-H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          org=$(curl -sS "${h[@]}" "https://api.supabase.com/v1/projects/$REF" | jq -r '.organization_id // empty')
          [ -n "$org" ] || { echo "::warning::could not read the project's organisation"; exit 0; }
          echo "Organisation: $(curl -sS "${h[@]}" "https://api.supabase.com/v1/organizations/$org" | jq -r '.name // "?"')"
          code=$(curl -sS -o m.json -w '%{http_code}' "${h[@]}" "https://api.supabase.com/v1/organizations/$org/members")
          if [ "$code" != "200" ]; then echo "::warning::members: HTTP $code"; rm -f m.json; exit 0; fi
          # Public logs: show only the first letter and the domain of each address.
          jq -r '.[] | "\(.role_name // "?")  \((.email // "?") | sub("^(?<a>.)[^@]*"; "\(.a)***"))  mfa=\(.mfa_enabled // "?")"' m.json
          rm -f m.json
