name: supabase-google-auth

# Turns on "Continue with Google" in the production Supabase project, so the
# Google ID token the app sends is accepted. Run it once after making the
# Google Cloud OAuth clients, and again only if the client changes.
#
# Needs:
#   variable GOOGLE_WEB_CLIENT_ID   the "Web application" OAuth client id
#   secret   GOOGLE_WEB_CLIENT_SECRET  that client's secret
#   secret   SUPABASE_URL, SUPABASE_ACCESS_TOKEN (already set for supabase-deploy)
#
# The Android OAuth client (package com.mldynamic.fieldos with the SHA-1
# of the upload key and of Play App Signing) needs no secret here: Google
# only has to know it exists in the same Google Cloud project.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enable:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.GOOGLE_WEB_CLIENT_SECRET }}
    steps:
      - name: Turn on the Google provider
        run: |
          set -euo pipefail
          missing=""
          [ -z "$SUPABASE_URL" ] && missing="$missing SUPABASE_URL"
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$CLIENT_ID" ] && missing="$missing GOOGLE_WEB_CLIENT_ID(variable)"
          [ -z "$CLIENT_SECRET" ] && missing="$missing GOOGLE_WEB_CLIENT_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Missing:$missing"
            exit 1
          fi
          ref=$(echo "$SUPABASE_URL" | sed -E 's#https?://([^.]+)\..*#\1#')
          body=$(jq -n --arg id "$CLIENT_ID" --arg secret "$CLIENT_SECRET" \
            '{external_google_enabled: true, external_google_client_id: $id, external_google_secret: $secret, external_google_skip_nonce_check: true}')
          code=$(curl -sS -o resp.json -w '%{http_code}' -X PATCH \
            "https://api.supabase.com/v1/projects/$ref/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' -d "$body")
          if [ "$code" != "200" ]; then
            echo "::error::Supabase answered HTTP $code"
            jq -r '.message // .' resp.json || true
            exit 1
          fi
          enabled=$(jq -r '.external_google_enabled' resp.json)
          rm -f resp.json
          echo "Google sign-in enabled: $enabled"
          echo "## Google sign-in enabled in Supabase: $enabled" >> "$GITHUB_STEP_SUMMARY"
