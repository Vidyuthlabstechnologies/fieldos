name: fieldos_mobile
description: "FieldOS Mobile — offline-first agentic construction platform (Flutter)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Local, offline-first SQLite (works on Android, iOS, and desktop for tests)
  drift: ^2.21.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.5

  # Password hashing (pure Dart, no native) + session tokens
  cryptography: ^2.7.0
  uuid: ^4.5.1

  # Exact Decimal arithmetic to match the Python estimation engine's precision.
  decimal: ^3.0.0

  # Optional online voice-to-DPR (Sarvam). App is fully usable offline without it.
  dio: ^5.8.0

  # Voice capture for the optional voice-to-DPR feature.
  record: ^7.1.1

  # Filesystem path helpers (databases dir, media dir).
  path: ^1.9.0

  # File picker for attaching documents (Storage Access Framework / document picker).
  # Pinned to this exact beta: file_picker <11 hardcodes compileSdk 34  # (breaks once anything needs >=36); 11.x ignores the android.builtInKotlin
  # gradle property and unconditionally skips its own Kotlin plugin under
  # AGP 9+, which conflicts with flutter_plugin_android_lifecycle (still
  # applying the traditional plugin unconditionally) and leaves
  # FilePickerPlugin never compiled. 12.0.0-beta.7 is the first version that
  # actually respects the flag instead of ignoring it. See
  # docs/MOBILE_GUIDE.md.
  file_picker: 12.0.0-beta.7

  # Camera-first photo evidence capture (DPR/inspection proof photos).
  # Uses the system camera app / Android Photo Picker, so no runtime
  # permission prompts of our own are needed.
  image_picker: ^1.1.2

  # Cross-employee sync backend (see docs/SUPABASE_SYNC_RESEARCH.md). The
  # plain `supabase` package (not `supabase_flutter`) deliberately -- its
  # SupabaseClient (PostgREST + Realtime + Auth) has no Flutter/platform
  # binding dependency, so the sync engine's push/pull logic can be tested
  # with real network calls in `flutter test`'s fast Dart VM runner against
  # the local dev instance, not just an emulator-only integration test.
  supabase: ^2.7.0

dev_dependencies:
  # Direct dependency: used by test/sync_engine_test.dart to check the local
  # Supabase stack is reachable before running (already present transitively
  # via `supabase`, declared explicitly per "depend on what you import").
  http: ^1.2.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.21.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
