name: fieldos_mobile
description: "FieldOS Mobile — offline-first agentic construction platform (Flutter)."
publish_to: 'none'

version: 1.6.6+14

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # Flutter's own widgets (date pickers, OK/Cancel) in Hindi and Telugu.
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.5.0

  # Local, offline-first SQLite (works on Android, iOS, and desktop for tests)
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.5

  # Password hashing (pure Dart, no native) + session tokens
  cryptography: ^2.7.0
  uuid: ^4.5.1

  # Exact Decimal arithmetic to match the Python estimation engine's precision.
  decimal: ^3.0.0

  # Voice reports. The phone's own speech recognition (Google's on Android,
  # Apple's on iPhone) does the listening: free, and offline once the
  # language's speech pack is on the phone. Sarvam (dio + record) is only a
  # fallback for phones that can't recognise the chosen language, and only
  # when an owner has added their own key.
  speech_to_text: ^7.5.0
  dio: ^5.11.1
  record: ^7.1.1

  # On-device translation of a Hindi/Telugu/... report into English for
  # the PDF and the client. Google ML Kit: free, offline after a one-time
  # language download of about 30 MB.
  google_mlkit_translation: ^0.15.1

  # Opening the privacy policy, terms, the Play subscription page and
  # email links.
  url_launcher: ^6.3.2

  # Filesystem path helpers (databases dir, media dir).
  path: ^1.9.0

  # File picker for attaching documents (Storage Access Framework / document picker).
  # Pinned to an exact version: file_picker <11 hardcodes compileSdk 34,
  # and 11.x skips its own Kotlin plugin under AGP 9+, which leaves
  # FilePickerPlugin never compiled. 12.0.0-beta.7 was the first version that
  # respects android.builtInKotlin; 13.x is the stable federated release of
  # that work (and fixes Android picks that never completed). Check a release
  # APK build before moving it. See docs/MOBILE_GUIDE.md.
  file_picker: 13.3.2

  # Camera-first photo evidence capture (DPR/inspection proof photos).
  # Uses the system camera app / Android Photo Picker, so no runtime
  # permission prompts of our own are needed.
  image_picker: ^1.1.2

  # Cross-employee sync backend (see docs/SUPABASE_SYNC_RESEARCH.md). The
  # plain `supabase` package (not `supabase_flutter`) deliberately -- its
  # SupabaseClient (PostgREST + Realtime + Auth) has no Flutter/platform
  # binding dependency, so the sync engine's push/pull logic can be tested
  # with real network calls in `flutter test`'s fast Dart VM runner against
  # the local dev instance, not just an emulator-only integration test.
  supabase: ^2.7.0

  # On-device alerts for a colleague's new issue / approval request / chat
  # message arriving through sync. Local notifications, not FCM push: no
  # Firebase project, no server, zero running cost (they fire when the app's
  # background sync runs, not instantly while the app is killed).
  flutter_local_notifications: ^22.3.3
  # Reminders are scheduled in the phone's time zone.
  timezone: ^0.11.2

  # GPS fix for attendance punch-in, checked against the project geofence.
  geolocator: ^14.1.2

  # DPR report as a PDF, shared to WhatsApp/email through the Android share
  # sheet -- how site reports actually travel in Indian construction today.
  pdf: ^3.13.1
  # .xlsx export (an xlsx is a zip of XML; already pulled in by image/pdf).
  archive: ^4.0.0
  # Date/time/GPS stamp on site photos (pure Dart; already pulled in by pdf).
  image: ^4.12.0
  share_plus: ^13.3.1

  # Site map: OpenStreetMap tiles, no API key or billing (Google Maps would
  # add a paid key to a zero-running-cost product).
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  purchases_flutter: ^11.0.1
  package_info_plus: ^10.2.2
  google_sign_in: ^7.2.0
  # Sign in with Apple on iPhone: Apple requires it next to Continue with
  # Google (App Review Guideline 4.8). Not shown on Android.
  sign_in_with_apple: ^8.2.0
  # The AI assistant reads its answers out loud with the phone's own voice
  # (Android/iOS text to speech): free and offline, no Sarvam needed.
  flutter_tts: ^4.2.5

dev_dependencies:
  # Direct dependency: used by test/sync_engine_test.dart to check the local
  # Supabase stack is reachable before running (already present transitively
  # via `supabase`, declared explicitly per "depend on what you import").
  http: ^1.2.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

  # Inter's licence, shown under Settings › Open-source licences.
  assets:
    - assets/fonts/OFL.txt
    # Mitra the mascot: one looping WebP and one still PNG per mood
    # (made by mascot/render_frames.py from the Rive scene).
    - assets/mascot/

  # Inter, the brand typeface (Latin subset, see tools/subset_fonts.sh).
  # Telugu, Hindi and other Indian scripts use the phone's own fonts.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.otf
        - asset: assets/fonts/Inter-Medium.otf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Inter-Bold.otf
          weight: 700
