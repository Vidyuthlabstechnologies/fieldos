# GitHub's Linux runners have 16 GB. 8 GB of heap plus 4 GB of metaspace for
# Gradle, a Kotlin daemon of the same size and R8 left the release build
# killed for lack of memory (the runner "lost communication" or got a
# shutdown signal mid-assembleRelease). Keep the total well under 16 GB.
org.gradle.jvmargs=-Xmx5G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx2G
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template. Left false:
# flutter_plugin_android_lifecycle (a near-universal transitive dependency)
# still unconditionally applies the traditional Kotlin plugin and breaks
# under AGP 9's built-in Kotlin when this is true. file_picker is pinned to
# 12.0.0-beta.7 specifically because, unlike 11.x, it correctly respects
# this flag instead of ignoring it. See docs/MOBILE_GUIDE.md.
android.builtInKotlin=false
